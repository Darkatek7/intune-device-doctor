name: Posture-Quellen

# Prüft wöchentlich, ob sich die Learn-Seiten hinter den Sollwerten der Ansicht „Empfehlungen“
# geändert haben (docs/posture-sources.lock.json). Werte werden nie automatisch übernommen:
# bei einem Befund entsteht ein Issue, ein Mensch prüft erneut. Bewusst nicht bei Pull Requests,
# damit die Netzabhängigkeit keinen PR blockiert.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posture-sources
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Das Token (issues: write) bleibt aus der Arbeitskopie und aus der Umgebung von `npm ci` und
      # der Prüfung heraus; nur der Schritt, der das Issue schreibt, bekommt es.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Quellen prüfen
        id: check
        run: |
          set +e
          npm run posture:sources -- --json "$RUNNER_TEMP/report.json"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Issue anlegen oder ergänzen
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: 'Empfehlungen: Learn-Quellen haben sich geändert'
        run: |
          npx tsx scripts/posture-sources/render-issue.ts "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/issue.md"
          cat "$RUNNER_TEMP/issue.md" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Zusammenfassung bei Abruffehlern
        if: steps.check.outputs.code == '2'
        run: |
          {
            echo '## Quellen nicht prüfbar'
            echo
            echo 'Nur Abruffehler (Zeitüberschreitung, 5xx, 429), kein Befund. Lauf später wiederholen.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis auswerten
        if: steps.check.outputs.code != '0'
        env:
          CHECK_CODE: ${{ steps.check.outputs.code }}
        run: |
          echo "::error::Quellenprüfung beendet mit Exit $CHECK_CODE (1 = Befund, 2 = nicht prüfbar)"
          exit 1
