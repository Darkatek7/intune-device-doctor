name: Demo veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Der Build-Job führt Fremdcode aus `npm ci` aus und bekommt deshalb nur Leserechte;
# Schreibrechte für Pages/OIDC hat ausschließlich der Job `deploy`.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions/configure-pages liest die Pages-Einstellungen des Repos (repos.getPages) – ohne
    # `pages: read` scheitert der Schritt mit „Get Pages site failed“.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Demo-Build ohne MSAL-IDs: der Live-Modus bleibt deaktiviert (src/config.ts).
      - run: npm run build
        env:
          VITE_APP_MODE: demo
          VITE_BASE: /intune-device-doctor/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
