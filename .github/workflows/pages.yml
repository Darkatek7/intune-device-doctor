name: Demo veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Der Build-Job führt Fremdcode aus `npm ci` aus und bekommt deshalb nur Leserechte;
# Schreibrechte für Pages/OIDC hat ausschließlich der Job `deploy`.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions/configure-pages liest die Pages-Einstellungen des Repos (repos.getPages) – ohne
    # `pages: read` scheitert der Schritt mit „Get Pages site failed“.
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      # Ist Pages im Repository nicht eingeschaltet (Settings › Pages › Quelle „GitHub Actions“), gibt es
      # nichts zu veröffentlichen: Der Lauf endet dann mit einem Hinweis statt bei jedem Push rot zu werden.
      # Nur ein 404 gilt als „nicht eingeschaltet“ – jeder andere Fehler lässt den Lauf weiterhin scheitern.
      - name: Pages eingeschaltet?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>&1); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<<"$out"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages ist für dieses Repository nicht eingeschaltet – Veröffentlichung übersprungen. Einschalten: Settings › Pages › Quelle „GitHub Actions“."
          else
            echo "$out"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.pages.outputs.enabled == 'true'
      # Demo-Build ohne MSAL-IDs: der Live-Modus bleibt deaktiviert (src/config.ts).
      - run: npm run build
        if: steps.pages.outputs.enabled == 'true'
        env:
          VITE_APP_MODE: demo
          VITE_BASE: /intune-device-doctor/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
