name: Container-Image (ghcr.io)

# Baut das nginx-Image mit dem fertigen dist/ und veröffentlicht es als
# ghcr.io/<owner>/intune-device-doctor (Tags: latest + sha-<kurz> von main, x.y.z/x.y bei Tags v*).
# Pull Requests bauen und testen das Image nur, ohne es zu veröffentlichen. Der wöchentliche Lauf
# holt Sicherheitsupdates des nginx-Basis-Images ins Image.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Führt Fremdcode aus `npm ci` aus und bekommt deshalb nur Leserechte (wie pages.yml).
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Neutraler Build ohne Mandantenwerte: Modus und Entra-App kommen zur Laufzeit aus den
      # VITE_*-Umgebungsvariablen des Containers (docker/40-mdm-doctor-config.sh).
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  image:
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Image-Name (ghcr.io verlangt Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Rauchtest: Image lokal starten, Konfiguration und Auslieferung prüfen.
      - name: Image für den Test bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          tags: mdm-doctor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rauchtest
        run: |
          docker run -d --name smoke -p 8080:80 \
            -e VITE_APP_MODE=live \
            -e VITE_MSAL_CLIENT_ID=11111111-2222-3333-4444-555555555555 \
            -e VITE_MSAL_TENANT_ID=contoso.onmicrosoft.com \
            mdm-doctor:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/config.js | tee /dev/stderr | grep -q '11111111-2222-3333-4444-555555555555'
          curl -fsS -o /dev/null 'http://127.0.0.1:8080/?device=x&code=y'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "frame-ancestors 'self'"
          # Ungültige Werte dürfen den Container nicht starten lassen.
          if docker run --rm -e VITE_MSAL_CLIENT_ID='x"};alert(1);//' mdm-doctor:test nginx -t; then
            echo 'ungültige Konfiguration wurde akzeptiert' >&2; exit 1
          fi
          docker rm -f smoke

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          pull: true
          cache-from: type=gha
