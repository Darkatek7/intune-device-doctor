<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Erscheinungsbild vor dem ersten Rendern setzen (Standard dunkel) – siehe src/theme.ts.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('mdm-doctor.theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>MDM Doctor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
