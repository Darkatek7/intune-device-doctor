server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Sicherheits-Header für jede Antwort. Ohne "merge" verwirft nginx alle add_header der
  # Server-Ebene, sobald ein location-Block ein eigenes add_header setzt (hier: Cache-Control) –
  # die Header kämen dann nie an. add_header_inherit gibt es ab nginx 1.29.3.
  add_header_inherit merge;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Clickjacking-Schutz (als Meta-Tag nicht möglich). 'self' statt 'none': MSAL lädt die eigene
  # Redirect-URI für die stille Token-Erneuerung in einem versteckten iframe.
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Gehashte Build-Dateien dauerhaft cachen, index.html nie.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: unbekannte Pfade (z. B. MSAL-Redirect mit Query) auf index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
